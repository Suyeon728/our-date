name: Refresh places and publish
on:
  workflow_dispatch:
  schedule:
    - cron: '23 21 * * *'
  push:
    branches: [main]
    paths-ignore: ['places.json']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python collect.py
        continue-on-error: true
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add places.json
          git diff --cached --quiet || (git commit -m 'Refresh place database' && git push)
      - uses: actions/configure-pages@v5
      - run: mkdir public && cp index.html places.json manifest.json sw.js icon.png public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
