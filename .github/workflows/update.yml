name: Refresh places and publish

on:
  workflow_dispatch:
  schedule:
    - cron: '23 21 * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'jeonnam-date-v2/places.json'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        working-directory: jeonnam-date-v2

    steps:
      - name: Checkout latest version
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect place data
        run: python collect.py

      - name: Save database safely
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add places.json

          if git diff --cached --quiet; then
            echo "No database changes"
          else
            git commit -m "Refresh place database"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        run: |
          mkdir -p ../public
          cp index.html places.json manifest.json sw.js icon.png ../public/

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy website
        uses: actions/deploy-pages@v4
