<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.json"><title>우리 둘의 아지트</title><style> *{box-sizing:border-box}body{max-width:760px;margin:auto;padding:16px;background:#f5f3eb;color:#294438;font:16px system-ui}header,section,article{background:white;padding:18px;border-radius:16px;margin:12px 0}header{background:#dce7d6}h1,h2,h3{margin:8px 0}button,input,select{font:inherit;padding:11px;border:1px solid #bdcbbc;border-radius:9px;color:inherit;background:white}button{cursor:pointer;background:#315747;color:white}button:disabled{opacity:.5}small{color:#647568}a{color:#315747}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:110px}article{border:1px solid #dce4d8}label{display:block;font-size:13px;margin:7px 0}.tag{background:#e8eee1;padding:4px 8px;border-radius:6px;font-size:12px}p{line-height:1.5}footer{font-size:12px}</style><header><small>OUR LITTLE ESCAPE · v4</small><h1>우리 둘의 아지트 🌿</h1>오늘은 어떤 문화생활을 할까요?</header><section><div class="row"><div><label for="day">데이트 날짜</label><input id="day" type="date"></div><div><label for="region">지역</label><select id="region"><option value="">전체 지역</option></select></div></div><div class="row" style="margin-top:12px"><select id="range" aria-label="이동 범위"><option value="all">전국 · 제한 없음</option><option value="near">근거리 · 2시간 이내</option><option value="far">장거리 · 2시간 초과</option></select></div><div class="row" style="margin-top:12px"><select id="category"><option value="">모든 행사</option><option>전시</option><option>공연</option><option>체험</option><option>축제</option><option>기타 행사</option></select><select id="fee"><option value="">무료 우선 · 전체</option><option value="free">무료만</option></select></div><p><small>여수시청 출발 · 자동차 예상 시간 기준 (실시간 교통 미반영)</small></p><p id="status" role="status"></p></section><section><h2>날짜별 문화행사</h2><div id="events"></div></section><section id="course"><h2>추천 데이트 코스</h2><p>행사를 선택하면 주변 카페 또는 도서관과 식당을 추천합니다.</p><button id="plain">행사 없이 코스 추천</button><div id="result"></div></section><footer>행사: 공공데이터포털 전국공연행사정보·전국문화축제 표준데이터. 장소: <a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors</a>. 도로시간: OSRM (실시간 교통 미반영). 행사 일정·무료 여부·예약·영업시간은 방문 전 확인.</footer><script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),regions='서울 부산 대구 인천 광주 대전 울산 세종 경기 강원 충북 충남 전북 전남 경북 경남 제주 지역_미확인'.replace('지역_미확인','미확인').split(), origin={lat:34.7604,lon:127.6622};let events=[],places=[],times=new Map(),revision=0;for(const r of regions)$('region').add(new Option(r,r));$('day').value=new Date(Date.now()+32400000).toISOString().slice(0,10);const coord=p=>p&&Number.isFinite(p.lat)&&Number.isFinite(p.lon),dist=(a,b)=>Math.hypot((a.lat-b.lat)*111,(a.lon-b.lon)*91),map=p=>'https://map.naver.com/p/search/'+encodeURIComponent(p.address||p.region+' '+p.name), link=p=>`<a href="${map(p)}" target="_blank" rel="noopener">지도 보기</a>`;async function road(points){let coords=[origin,...points].map(p=>p.lon+','+p.lat).join(';');let r=await fetch('https://router.project-osrm.org/table/v1/driving/'+coords+'?sources=0&destinations='+points.map((_,i)=>i+1).join(';'),{signal:AbortSignal.timeout(12000)});if(!r.ok)throw Error('route');let j=await r.json();if(j.code!=='Ok')throw Error('route');return j.durations[0].map(t=>t===null?null:t/60)}
async function render(){let rev=++revision,d=$('day').value,r=$('region').value,c=$('category').value,f=$('fee').value,range=$('range').value;let list=events.filter(e=>e.start<=d&&e.end>=d&&(!r||((e.province==='지역 미확인'?'미확인':e.province)||'미확인')===r)&&(!c||e.category===c)&&(!f||e.free));$('events').textContent=range==='all'?'행사 목록 표시 중…':'운전시간 확인 중…';let points=range==='all'?[]:list.filter(e=>coord(e)&&!times.has(e));for(let i=0;i<points.length;i+=40){if(rev!==revision)return;let part=points.slice(i,i+40);try{let t=await road(part);part.forEach((e,j)=>times.set(e,t[j]))}catch{}}if(rev!==revision)return;let unknown=list.filter(e=>times.get(e)==null); if(range!=='all') list=list.filter(e=>times.get(e)!=null&&(range==='near'?times.get(e)<=120:times.get(e)>120));list.sort((a,b)=>a.region.localeCompare(b.region,'ko')||Number(b.free)-Number(a.free)||a.start.localeCompare(b.start));$('events').replaceChildren();if(!list.length)$('events').textContent='해당 조건에서 확인된 행사가 없습니다. 실제 행사가 없다는 뜻은 아닙니다.';let last='';for(const e of list){if(last!==e.region){let h=document.createElement('h3');h.textContent=e.region;$('events').append(h);last=e.region}let a=document.createElement('article'),t=times.get(e);a.innerHTML=`<span class="tag">${esc(e.category)} · ${e.free?'무료':esc(e.price||'요금 미확인')}</span><h3>${esc(e.name)}</h3><small>${esc(e.start)} ~ ${esc(e.end)} ${esc(e.time||'')}</small><p>${esc(e.venue||e.address)}<br>${t==null?'운전시간 미확인':'편도 약 '+Math.ceil(t)+'분'}</p>${link(e)} ${e.phone?' · 문의 '+esc(e.phone):''}<p><button>이 행사로 코스 만들기</button></p>`;a.querySelector('button').onclick=()=>course(e);$('events').append(a)} if(range!=='all'&&unknown.length){let h=document.createElement('h3');h.textContent='운전시간 미확인 · '+unknown.length+'건 (거리 필터 미적용)';$('events').append(h);for(const e of unknown){let a=document.createElement('article');a.innerHTML=`<b>${esc(e.name)}</b><p>${esc(e.region)} · ${esc(e.start)} ~ ${esc(e.end)} · ${esc(e.category)} · ${e.free?'무료':esc(e.price||'요금 미확인')}</p>${link(e)} <button>코스 보기</button>`;a.querySelector('button').onclick=()=>course(e);$('events').append(a)}}}
async function course(e){$('course').scrollIntoView({behavior:'smooth'});$('result').textContent='주변 장소 확인 중…';let base=coord(e)?e:(!e&&!$('region').value?origin:null), local=base?places.filter(p=>coord(p)&&dist(base,p)<8):[];let nearby=local;let w=nearby.filter(p=>['cafe','library'].includes(p.kind)),f=nearby.filter(p=>p.kind==='restaurant');if(base&&(!w.length||!f.length)){try{let q=`[out:json][timeout:20];(nwr(around:3500,${base.lat},${base.lon})["amenity"~"^(cafe|library|restaurant)$"]["name"];);out center 150;`;let r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:new URLSearchParams({data:q}),signal:AbortSignal.timeout(25000)});if(!r.ok)throw Error();let j=await r.json();nearby=nearby.concat(j.elements.map(x=>({name:x.tags?.['name:ko']||x.tags?.name,kind:x.tags?.amenity,lat:(x.center||x).lat,lon:(x.center||x).lon,region:e?.region||'여수',open:x.tags?.opening_hours})).filter(p=>p.name&&coord(p)));}catch{}}w=nearby.filter(p=>['cafe','library'].includes(p.kind)).sort((a,b)=>dist(base,a)-dist(base,b));f=nearby.filter(p=>p.kind==='restaurant').sort((a,b)=>dist(base,a)-dist(base,b));let area=e?.address||e?.region||$('region').value||'여수';let search=q=>`<a target="_blank" rel="noopener" href="https://map.naver.com/p/search/${encodeURIComponent(area+' '+q)}">${esc(q)} 지도 검색</a>`;let card=(p,label,fallback)=>p?`<article><small>${label}</small><h3>${esc(p.name)}</h3>${link(p)}<p>${esc(p.open||'영업시간 확인 필요')}</p></article>`:`<article><small>${label}</small><p>수집된 장소 없음 · ${search(fallback)}</p></article>`;$('result').innerHTML=card(w[0],'카페·도서관','카페 도서관')+card(f[0],'식사','맛집')+(e?card(e,'문화행사','문화행사'):'')+'<p>주변 후보는 좌표상 가까운 순서이며 맛·작업환경·실제 이동 동선은 검증되지 않았습니다. 행사 시간과 운영 여부를 확인하세요.</p>'}
for(const id of ['day','region','category','fee','range'])$(id).onchange=render;$('plain').onclick=()=>course(null);(async()=>{try{let p=await fetch('places.json',{cache:'no-cache'}).then(r=>r.json());places=p.places||[]}catch{}try{let j=await fetch('events.json',{cache:'no-cache'}).then(r=>r.json());events=j.events||[];$('status').textContent=j.updated?'행사 DB '+j.updated+' · '+events.length+'건 / 장소 '+places.length+'곳 · '+Object.entries(j.status||{}).map(x=>x.join(': ')).join(' / '):'행사 API 연결 전 · 장소 '+places.length+'곳'}catch{$('status').textContent='행사 DB 연결 필요 · 장소 '+places.length+'곳'}render()})();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
